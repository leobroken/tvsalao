<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - TV do Salão</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white font-sans antialiased min-h-screen flex flex-col items-center justify-center p-4">

    <!-- PAINEL DE CONTROLE (Exibido por padrão) -->
    <main id="view-painel" class="max-w-xl w-full space-y-6">
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-bold tracking-wide">📺 Painel de Controle - TV do Salão</h1>
            <p class="text-sm text-gray-400">Configure os vídeos que vão passar na TV do seu estabelecimento.</p>
        </div>

        <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl shadow-xl space-y-5">
            <div>
                <label class="block text-sm font-medium mb-1 text-gray-300">Link ou ID do Player Horizontal (TV ao Vivo / Fundo)</label>
                <input type="text" id="input-horizontal" placeholder="Ex: dQw4w9WgXcQ" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-white focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1 text-gray-300">Link ou ID do Player Vertical (Propagandas / Shorts)</label>
                <input type="text" id="input-vertical" placeholder="Ex: jNQXAC9IVRw" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-white focus:outline-none focus:border-blue-500">
            </div>

            <button onclick="salvarConfiguracoes()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl transition shadow-md">
                💾 Salvar Configurações
            </button>
        </div>

        <div class="pt-2">
            <button onclick="mudarAba('tv')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl transition shadow-lg text-lg flex items-center justify-center space-x-2">
                <span>🎬 Abrir Tela do Salão</span>
            </button>
        </div>
    </main>

    <!-- TELA DA TV (Oculta até clicar no botão) -->
    <main id="view-tv" class="hidden fixed inset-0 bg-black flex w-screen h-screen overflow-hidden">
        <!-- Botão flutuante discreto para voltar ao painel -->
        <button onclick="mudarAba('painel')" class="absolute top-4 left-4 z-50 bg-black/60 hover:bg-black/90 text-white/80 hover:text-white px-3 py-1.5 rounded-lg text-xs backdrop-blur border border-white/10 transition">
            ⚙️ Voltar ao Painel
        </button>

        <!-- Lado Esquerdo: Player Horizontal (TV ao Vivo) -->
        <div class="flex-1 h-full bg-black flex items-center justify-center relative">
            <div id="player-horizontal-container" class="w-full h-full"></div>
        </div>

        <!-- Lado Direito: Player Vertical (Propagandas) -->
        <div class="w-[380px] h-full bg-zinc-950 border-l border-zinc-800 flex items-center justify-center relative">
            <div id="player-vertical-container" class="w-full h-full"></div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
